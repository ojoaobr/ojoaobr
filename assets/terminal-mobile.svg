<text x="20" y="250" class="o" style="animation-delay:4.11s">&gt; Legacy modernization, clean arch</text>
<text x="20" y="294" class="p" style="animation-delay:4.29s">joao@matrix:~$ <tspan class="c">./stack --list</tspan></text>
<rect x="146.0" y="279" width="129.6" height="20" fill="#0D0208" class="cover" style="animation:fadein .01s 4.29s forwards, type 0.98s steps(14) 4.59s forwards;--d:117.6px"/>
<text x="20" y="316" class="o" style="animation-delay:5.82s">[back-end]  C# · .NET · ASP.NET Core</text>
<text x="20" y="338" class="o" style="animation-delay:6.00s">[messaging] RabbitMQ · Kafka · Redis</text>
<text x="20" y="360" class="o" style="animation-delay:6.18s">[data]      SQL Server · MongoDB</text>
<text x="20" y="382" class="o" style="animation-delay:6.36s">[cloud/ops] AWS · Azure · Docker · Datadog</text>
<text x="20" y="404" class="o" style="animation-delay:6.54s">[testing]   xUnit · Gatling</text>
<text x="20" y="448" class="p" style="animation-delay:6.72s">joao@matrix:~$ </text>
<rect x="148.0" y="434" width="9" height="18" fill="#00FF41" class="blink" style="animation-delay:6.72s,6.72s"/>
</g>
<rect x="2" y="32" width="416" height="428" fill="url(#crt)"/>
</svg>
