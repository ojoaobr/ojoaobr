<svg xmlns="http://www.w3.org/2000/svg" width="420" height="462" viewBox="0 0 420 462">
<style>
  text { font: 14px 'Courier New', Courier, monospace; white-space: pre; }
  .p, .o { opacity: 0; animation: fadein .01s forwards; }
  .p { fill: #00FF41; font-weight: bold; }
  .c { fill: #D7FFD9; font-weight: normal; }
  .o { fill: #00FF41; opacity: 0; }
  .cover { opacity: 0; }
  .blink { opacity: 0; animation: fadein .01s forwards, blink 1s step-end infinite; }
  @keyframes fadein { to { opacity: 1; } }
  @keyframes blink { 50% { fill-opacity: 0; } }
  @keyframes type { to { transform: translateX(var(--d)); } }
  .title { font: 13px 'Courier New', Courier, monospace; fill: #008F11; }
</style>
<defs>
  <pattern id="crt" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".3"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="418" height="460" rx="10" fill="#0D0208" stroke="#008F11" stroke-width="2"/>
<rect x="1" y="1" width="418" height="30" rx="10" fill="#03160A"/>
<rect x="1" y="20" width="418" height="11" fill="#03160A"/>
<line x1="1" y1="31" x2="419" y2="31" stroke="#008F11" stroke-width="1"/>
<circle cx="22" cy="16" r="6" fill="#FF5F56"/><circle cx="42" cy="16" r="6" fill="#FFBD2E"/><circle cx="62" cy="16" r="6" fill="#27C93F"/>
<text x="210.0" y="20" text-anchor="middle" class="title">joao@matrix: ~ — zsh</text>
<g filter="url(#glow)">
<text x="20" y="52" class="p" style="animation-delay:0.60s">joao@matrix:~$ <tspan class="c">whoami</tspan></text>
<rect x="146.0" y="37" width="62.4" height="20" fill="#0D0208" class="cover" style="animation:fadein .01s 0.60s forwards, type 0.42s steps(6) 0.90s forwards;--d:50.4px"/>
<text x="20" y="74" class="o" style="animation-delay:1.57s">João Freitas</text>
<text x="20" y="96" class="o" style="animation-delay:1.75s">Software Engineer · .NET Core · 5 years</text>
<text x="20" y="140" class="p" style="animation-delay:1.93s">joao@matrix:~$ <tspan class="c">cat about.txt</tspan></text>
<rect x="146.0" y="125" width="121.2" height="20" fill="#0D0208" class="cover" style="animation:fadein .01s 1.93s forwards, type 0.91s steps(13) 2.23s forwards;--d:109.2px"/>
<text x="20" y="162" class="o" style="animation-delay:3.39s">&gt; Back-end at LATAM's largest car rental</text>
<text x="20" y="184" class="o" style="animation-delay:3.57s">&gt; Event-driven: RabbitMQ &amp; Kafka</text>
<text x="20" y="206" class="o" style="animation-delay:3.75s">&gt; DB tuning: SQL Server &amp; MongoDB</text>
