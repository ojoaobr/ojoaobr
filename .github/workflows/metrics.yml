name: Metrics

on:
  schedule:
    - cron: "0 6 * * *" # daily, 03:00 in São Paulo
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

env:
  # Matrix theme shared by every card
  MATRIX_CSS: |
    svg:not(svg svg) { background: #0D0208; border-radius: 10px; box-shadow: inset 0 0 0 2px #008F11; }
    .items-wrapper { padding: 4px 10px 6px; box-sizing: border-box; }
    h2, h3, .field, small, span { color: #00FF41 !important; font-family: 'Courier New', Courier, monospace !important; }
    h2 svg, .field > svg { fill: #00FF41 !important; }
    svg.bar { transform: scaleX(.9565); transform-origin: left center; }
    small, small div { color: #B6FFC7 !important; font-size: 13px !important; font-weight: bold !important; }
    [fill="#ebedf0"] { fill: #1E4D2B !important; }
    [fill="#9be9a8"] { fill: #00802B !important; }
    [fill="#40c463"] { fill: #00B336 !important; }
    [fill="#30a14e"] { fill: #00E63D !important; }
    [fill="#216e39"] { fill: #7CFF9A !important; }
    svg.calendar text { fill: #00FF41 !important; font-family: 'Courier New', Courier, monospace; }

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Stats
        uses: lowlighter/metrics@latest
        with:
          # Classic PAT with `repo` + `read:org` scopes, stored as a repository secret
          token: ${{ secrets.METRICS_TOKEN }}
          user: ojoaobr
          filename: assets/stats.svg
          committer_message: "chore: update stats metrics"
          template: classic
          config_timezone: America/Sao_Paulo
          config_display: regular
          config_padding: 0, 8
          extras_css: ${{ env.MATRIX_CSS }}

          base: activity, community, repositories
          repositories_affiliations: owner, collaborator, organization_member

          plugin_calendar: yes
          plugin_calendar_limit: 1

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ojoaobr
          filename: assets/languages.svg
          committer_message: "chore: update languages metrics"
          template: classic
          config_timezone: America/Sao_Paulo
          config_display: regular
          config_padding: 0, 8
          extras_css: ${{ env.MATRIX_CSS }}

          # Only the languages card
          base: ""
          # Include private repos you own + org repos you contribute to
          repositories_affiliations: owner, collaborator, organization_member

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 2%
          plugin_languages_other: yes
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, scss, dockerfile, shell, powershell, makefile, batchfile, procfile
          plugin_languages_colors: >-
            0:#00FF41, 1:#00CC33, 2:#00A62A, 3:#008F11,
            4:#2BFF88, 5:#6BFF9F, 6:#00662B, 7:#B6FFC7
